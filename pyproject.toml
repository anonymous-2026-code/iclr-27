[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymous-oracle-tta"
version = "1.0.0"
description = "Anonymous Frozen, Practical, and Oracle TTA review artifact"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "numpy==2.1.2", "pandas==2.3.3", "pyarrow==22.0.0",
  "scikit-learn==1.7.2", "scipy==1.16.3", "matplotlib==3.10.8",
  "torch==2.5.1", "tqdm==4.66.5", "Jinja2==3.1.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
